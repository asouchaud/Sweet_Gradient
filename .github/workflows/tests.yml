name: Tests

on:
  push:
    branches:
    - main
  pull_request:

jobs:
  test:
    runs-on: macos-latest 

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python run_tests.py
